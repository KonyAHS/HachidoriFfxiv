<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINAL FANTASY XIV</title>
    <style>
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        overflow: hidden !important;
        background: transparent !important;
        user-select: text !important;
        -webkit-user-select: text !important;
      }
      #ffxiv-anchor {
        position: fixed;
        top: 0;
        left: 0;
        margin: 0;
        padding: 0;
        opacity: 0;
        pointer-events: none;
        white-space: pre;
        line-height: 1;
        z-index: 0;
      }
      #ffxiv-before {
        position: fixed;
        left: -99999px;
        top: -99999px;
        opacity: 0;
        pointer-events: none;
        white-space: pre;
      }
      #ffxiv-target {
        position: fixed;
        opacity: 0;
        pointer-events: none;
        white-space: pre;
        line-height: 1;
      }
    </style>
    <script src="ffxiv-bridge.js"></script>
  </head>
  <body>
    <div id="ffxiv-anchor" lang="ja"><span id="ffxiv-before"></span><span id="ffxiv-target"></span></div>
  </body>
</html>
