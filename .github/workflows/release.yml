name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download Dalamud development assemblies
        shell: pwsh
        run: |
          $csproj = Get-Content -LiteralPath 'HachidoriFfxiv/HachidoriFfxiv.csproj' -Raw
          if ($csproj -notmatch 'Dalamud\.NET\.Sdk/(\d+)\.') { throw 'Could not read Dalamud.NET.Sdk major version from HachidoriFfxiv.csproj.' }
          $expectedApi = $Matches[1]
          $version = Invoke-RestMethod https://raw.githubusercontent.com/goatcorp/dalamud-distrib/main/version
          if ($version.AssemblyVersion -notlike "$expectedApi.*") { throw "Dalamud has moved beyond API $expectedApi (live: $($version.AssemblyVersion)); update Dalamud.NET.Sdk in HachidoriFfxiv.csproj before releasing." }
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" -DestinationPath "$env:APPDATA/XIVLauncher/addon/Hooks/dev" -Force
      # The offline engine takes a few minutes to compile; reuse it while its
      # pinned sources, patches and build script are unchanged.
      - name: Cache the offline engine
        uses: actions/cache@v4
        with:
          path: |
            native/bin
            native/src
          key: hdw-native-v2-${{ runner.os }}-${{ hashFiles('native/sources.json', 'native/CMakeLists.txt', 'native/*.cpp', 'native/build.ps1', 'native/patches/**', 'native/compat/**') }}
      - name: Build and verify
        shell: pwsh
        run: ./build.ps1 -Verify
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/package-release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: HachidoriFfxiv
          path: HachidoriFfxiv/bin/x64/Release/HachidoriFfxiv/latest.zip
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-assets
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Hachidori for FFXIV $RELEASE_TAG" --generate-notes
